<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豆子发芽</title>
<style>
:root,body[data-theme=blue]{--bg:#e6f3fb;--card:rgba(255,255,255,.88);--main:#3a8fb7;--soft:#d3eaf6;--text:#2c4a5a;--muted:#7b95a3;--accent:#ff9fb1;--ok:#5bbf8a}
body[data-theme=yellow]{--bg:#fff6d9;--main:#e0a526;--soft:#ffeaa6;--text:#5b4a1f;--muted:#a6946a;--accent:#ff9a76}
body[data-theme=pink]{--bg:#f8e8ee;--main:#d98aa3;--soft:#f6cfdc;--text:#5e3b48;--muted:#a58693;--accent:#8fc9b0}
body[data-theme=silver]{--bg:#eef0f3;--main:#7d8ba0;--soft:#dde2ea;--text:#35404f;--muted:#8d97a6;--accent:#f0a3b4}
body[data-theme=dark]{--bg:#1c2530;--card:rgba(40,52,66,.9);--main:#6fb8da;--soft:#34475a;--text:#e6eef4;--muted:#92a5b4;--accent:#ff9fb1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:84px}
#bgimg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1;display:none}
#bgov{position:fixed;inset:0;background:var(--bg);z-index:-1;opacity:.5;display:none}
header{padding:18px 18px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}header small{color:var(--muted)}
main{padding:8px 14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.card h3{margin:0 0 10px;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);backdrop-filter:blur(10px);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 0;border-radius:14px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--main);background:var(--soft);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:var(--main);color:#fff;border-radius:14px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--text)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}.btn.danger{background:#e57373}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=month],select,textarea{width:100%;border:1.5px solid var(--soft);background:rgba(255,255,255,.7);border-radius:12px;padding:8px 10px;color:#2c3a44}
body[data-theme=dark] input,body[data-theme=dark] select,body[data-theme=dark] textarea{background:#2a3846;color:#e6eef4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--soft);margin:3px 4px 3px 0;font-size:13px;cursor:pointer;border:2px solid transparent}
.chip.on{border-color:var(--main);font-weight:700}
.hero{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:72px;height:72px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-direction:column}
.ring small{font-size:10px;color:var(--muted);font-weight:400}
.sprout{font-size:44px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--accent));border-radius:99px}
.hab{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--soft)}
.hab:last-child{border:0}
.ck{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--main);background:none;flex:none;font-size:18px;line-height:1;color:#fff;cursor:pointer}
.ck.on{background:var(--main)}.ck.auto{background:var(--ok);border-color:var(--ok)}
.hab .nm{flex:1}.hab .nm b{display:block}.hab .nm small{color:var(--muted)}
.hab input.note{margin-top:5px;padding:5px 8px;font-size:13px}
.star{font-size:28px;cursor:pointer;filter:grayscale(1);opacity:.4}.star.on{filter:none;opacity:1}
canvas{width:100%;height:170px;display:block}
.stat{text-align:center;background:var(--soft);border-radius:14px;padding:10px 4px}.stat b{display:block;font-size:18px}.stat small{color:var(--muted);font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{aspect-ratio:1;border-radius:8px;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.cal .h{aspect-ratio:auto;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--soft)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal .box{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}
.muted{color:var(--muted);font-size:13px}.tag{font-size:11px;background:var(--soft);padding:2px 8px;border-radius:99px;margin-left:6px}
</style></head><body data-theme="blue">
<div id="bgimg"></div><div id="bgov"></div>
<header><div><h1 id="title">豆子发芽 🌱</h1><small id="sub"></small></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<script>
const KEY='douzi_fayea_data';
const DATA_VERSION=2;
const THEMES={blue:'海蓝',yellow:'浅黄',pink:'灰粉',silver:'银白',dark:'黑色'};
const METRICS={bed:{label:'入睡时间',icon:'🌙'},sleepQ:{label:'睡眠质量(1-5)',icon:'⭐'},weight:{label:'体重(斤)',icon:'⚖️'},steps:{label:'步数',icon:'👣'},exMin:{label:'运动时长(分钟)',icon:'💪'},kcal:{label:'消耗卡路里(kcal)',icon:'🔥'}};
const TABS=[['home','🏡','总览'],['check','✅','打卡'],['goals','🎯','目标'],['trend','📈','趋势'],['sum','📅','总结'],['set','⚙️','设置']];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const avg=a=>{a=a.filter(v=>v!=null&&!isNaN(v));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const fmt=(v,d=0)=>v==null?'–':Number(v).toFixed(d).replace(/\.0+$/,'');
function bedNum(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return (h<12?h+24:h)+m/60}
function fmtBed(v){if(v==null)return '–';v=v%24;let h=Math.floor(v),m=Math.round((v-h)*60);if(m==60){h=(h+1)%24;m=0}return pad(h)+':'+pad(m)}

function defaults(){
  const g1=uid(),g2=uid(),g3=uid(),g4=uid();
  return {v:DATA_VERSION,start:today(),
   settings:{name:'豆子发芽',theme:'blue',bg:'',bgOpacity:55},
   goals:[
    {id:g1,emoji:'😴',name:'睡眠质量提升',desc:'11点前睡觉'},
    {id:g2,emoji:'⚖️',name:'减肥',desc:'从120斤减到110斤',w0:120,w1:110},
    {id:g3,emoji:'💪',name:'运动',desc:'慢慢恢复身体健康,再加强度。先从步行或室内跳操开始'},
    {id:g4,emoji:'📚',name:'学习',desc:'FRM、经济学知识、简单高数'}],
   habits:[
    {id:uid(),name:'11点前早睡',goal:g1,kind:'bed',time:'23:00',weekly:0},
    {id:uid(),name:'步行8000步 / 跳操30分钟',goal:g3,kind:'ex',steps:8000,min:30,weekly:0},
    {id:uid(),name:'泡脚',goal:g2,kind:'manual',weekly:2},
    {id:uid(),name:'学习打卡',goal:g4,kind:'manual',weekly:0}],
   logs:{}};
}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.habits)S=defaults();
  migrate();
}
function migrate(){
  S.settings=Object.assign({name:'豆子发芽',theme:'blue',bg:'',bgOpacity:55},S.settings||{});
  S.goals=S.goals||[];S.logs=S.logs||{};S.start=S.start||today();S.v=DATA_VERSION;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存失败:存储空间可能已满(背景图太大?)')}}
const log=(d,create)=>{if(!S.logs[d]&&create)S.logs[d]={checks:{},notes:{},m:{},diary:''};return S.logs[d]};
const actHabits=()=>S.habits.filter(h=>!h.archived);

function isDone(h,d){
  const l=S.logs[d];if(!l)return false;
  if(l.checks&&l.checks[h.id])return true;
  const m=l.m||{};
  if(h.kind==='bed'&&m.bed){return bedNum(m.bed)<=bedNum(h.time||'23:00')}
  if(h.kind==='ex'){return (m.steps!=null&&m.steps!==''&&+m.steps>=(h.steps||8000))||(m.exMin!=null&&m.exMin!==''&&+m.exMin>=(h.min||30))}
  return false;
}
const isAuto=(h,d)=>isDone(h,d)&&!(S.logs[d].checks&&S.logs[d].checks[h.id]);
function hrate(h,from,to){
  let s=from<S.start?S.start:from;if(to>today())to=today();if(s>to)return null;
  const days=diff(s,to)+1;let done=0;
  for(let d=s;d<=to;d=addDays(d,1))if(isDone(h,d))done++;
  const tgt=h.weekly?Math.max(1,h.weekly*days/7):days;return Math.min(1,done/tgt);
}
function goalRate(gid,from,to){return avg(actHabits().filter(h=>h.goal===gid).map(h=>hrate(h,from,to)))}
function allRate(from,to){return avg(actHabits().map(h=>hrate(h,from,to)))}
function dayRate(d){const hs=actHabits().filter(h=>!h.weekly);if(!hs.length)return null;return hs.filter(h=>isDone(h,d)).length/hs.length}
function weekCount(h,d){let n=0;for(let i=0;i<7;i++)if(isDone(h,addDays(d,-i)))n++;return n}
function anyDone(d){return actHabits().some(h=>isDone(h,d))}
function streak(){let d=today();if(!anyDone(d))d=addDays(d,-1);let n=0;while(anyDone(d)){n++;d=addDays(d,-1)}return n}
function totalDays(){return Object.keys(S.logs).filter(anyDone).length}
function latest(key){const ks=Object.keys(S.logs).sort().reverse();for(const k of ks){const v=S.logs[k].m&&S.logs[k].m[key];if(v!==undefined&&v!==''&&v!=null)return {d:k,v}}return null}
function metricVal(d,key){const l=S.logs[d];if(!l||!l.m)return null;const v=l.m[key];if(v===undefined||v===''||v==null)return null;return key==='bed'?bedNum(v):+v}
function sproutStage(n){return n<3?['🌰','种子刚刚入土']:n<10?['🌱','冒出小芽啦']:n<25?['🌿','长出嫩叶']:n<50?['🪴','越长越壮']:n<100?['🌳','长成小树']:['🌸','开花啦']}

let tab='home',cur=today(),rangeDays=30,sumMode='m',sumMonth=today().slice(0,7),sumYear=String(new Date().getFullYear());
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.body.dataset.theme=S.settings.theme;
  $('title').textContent=S.settings.name+' 🌱';
  const dn=['日','一','二','三','四','五','六'],t=new Date();
  $('sub').textContent=`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日 周${dn[t.getDay()]}`;
  const bg=S.settings.bg;$('bgimg').style.display=bg?'block':'none';$('bgov').style.display=bg?'block':'none';
  if(bg)$('bgimg').style.backgroundImage=`url(${bg})`;$('bgov').style.opacity=(S.settings.bgOpacity||55)/100;
  $('nav').innerHTML=TABS.map(([k,i,n])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');
  const v={home:vHome,check:vCheck,goals:vGoals,trend:vTrend,sum:vSum,set:vSet}[tab]();
  $('view').innerHTML=v;
  if(tab==='trend')drawTrend();if(tab==='sum')drawSum();
}
const ring=(p,label)=>`<div class="ring" style="background:conic-gradient(var(--main) ${Math.round((p||0)*360)}deg,var(--soft) 0)"><div>${p==null?'–':Math.round(p*100)+'%'}<small>${label}</small></div></div>`;
const pct=p=>p==null?'–':Math.round(p*100)+'%';

function vHome(){
  const t=today(),n=totalDays(),[em,tx]=sproutStage(n),w0=addDays(t,-6);
  const goals=S.goals.map(g=>{
    const r=goalRate(g.id,w0,t);let extra='';
    if(g.w0!=null){const c=latest('weight');if(c){const p=Math.max(0,Math.min(1,(g.w0-c.v)/(g.w0-g.w1)));extra=`<div class="muted">当前 ${c.v} 斤 → 目标 ${g.w1} 斤(已完成 ${pct(p)})</div><div class="bar"><i style="width:${p*100}%"></i></div>`}}
    return `<div style="margin:10px 0"><div class="row"><b>${esc(g.emoji)} ${esc(g.name)}</b><span class="fit muted">近7天 ${pct(r)}</span></div><div class="bar"><i style="width:${(r||0)*100}%"></i></div>${extra}</div>`}).join('')||'<p class="muted">还没有目标,去「目标」页添加吧。</p>';
  const hs=actHabits().filter(h=>!h.weekly);
  return `<div class="card hero"><div class="sprout">${em}</div><div style="flex:1"><b>${tx}</b><div class="muted">累计打卡 ${n} 天</div></div>${ring(dayRate(t),'今日')}</div>
  <div class="grid3"><div class="stat"><b>${streak()}</b><small>连续天数 🔥</small></div><div class="stat"><b>${pct(allRate(w0,t))}</b><small>本周完成率</small></div><div class="stat"><b>${latest('weight')?latest('weight').v:'–'}</b><small>最新体重(斤)</small></div></div>
  <div class="card"><h3>🎯 目标进度</h3>${goals}</div>
  <div class="card"><h3>今日待办</h3>${hs.length?hs.map(h=>`<div class="hab"><span>${isDone(h,t)?'✅':'⬜'}</span><div class="nm">${esc(h.name)}</div></div>`).join(''):'<p class="muted">暂无每日打卡项</p>'}<button class="btn" style="margin-top:10px;width:100%" onclick="go('check')">去打卡</button></div>`;
}

function habHtml(h,d){
  const l=S.logs[d]||{checks:{},notes:{}},done=isDone(h,d),auto=isAuto(h,d);
  const wk=h.weekly?`<small>本周 ${Math.min(weekCount(h,d),99)} / ${h.weekly} 次</small>`:'';
  const hint=h.kind==='bed'?`<small>入睡 ≤ ${h.time||'23:00'} 自动打勾</small>`:h.kind==='ex'?`<small>步数≥${h.steps} 或 运动≥${h.min}分钟 自动打勾</small>`:'';
  const g=S.goals.find(x=>x.id===h.goal);
  return `<div class="hab"><button class="ck ${done?(auto?'auto':'on'):''}" onclick="toggle('${h.id}')">${done?'✓':''}</button>
  <div class="nm"><b>${esc(h.name)}${g?`<span class="tag">${esc(g.emoji)} ${esc(g.name)}</span>`:''}</b>${wk} ${hint}
  <input class="note" type="text" placeholder="想记点什么…" value="${esc((l.notes||{})[h.id]||'')}" onchange="setNote('${h.id}',this.value)"></div></div>`;
}
function vCheck(){
  const l=S.logs[cur]||{m:{},diary:''},m=l.m||{},hs=actHabits();
  const stars=[1,2,3,4,5].map(i=>`<span class="star ${(+m.sleepQ||0)>=i?'on':''}" onclick="setQ(${i})">⭐</span>`).join('');
  const inp=(k,lab,ph)=>`<div><label class="f">${lab}</label><input type="number" inputmode="decimal" step="any" placeholder="${ph}" value="${esc(m[k]??'')}" onchange="setM('${k}',this.value)"></div>`;
  return `<div class="card"><div class="row"><button class="btn ghost fit" onclick="shift(-1)">◀</button><input type="date" value="${cur}" max="${today()}" onchange="cur=this.value||today();render()"><button class="btn ghost fit" onclick="shift(1)">▶</button></div>
  <div class="hero" style="margin-top:12px"><div id="prog">${ring(dayRate(cur),'当日')}</div><div class="muted">${cur===today()?'今天':'补打卡'}:勾选完成的项目,有想法就写在下面 ✍️</div></div></div>
  <div class="card"><div class="row"><h3 style="flex:1">打卡清单</h3><button class="btn sm ghost fit" onclick="editHabit()">＋ 新增</button></div><div id="hl">${hs.map(h=>habHtml(h,cur)).join('')||'<p class="muted">还没有打卡项目,点右上角新增</p>'}</div></div>
  <div class="card"><h3>📊 今日数据</h3><div class="grid2">
   <div><label class="f">🌙 入睡时间</label><input type="time" value="${esc(m.bed||'')}" onchange="setM('bed',this.value)"></div>
   <div><label class="f">⭐ 睡眠质量(满分5)</label><div>${stars}</div></div>
   ${inp('weight','⚖️ 体重(斤)','例如 118.5')}${inp('steps','👣 步数','例如 8000')}${inp('exMin','💪 运动时长(分钟)','例如 30')}${inp('kcal','🔥 消耗卡路里','例如 300')}
  </div><label class="f" style="margin-top:12px">📝 今日小记</label><textarea rows="3" placeholder="今天感觉怎么样?" onchange="setDiary(this.value)">${esc(l.diary||'')}</textarea></div>`;
}
function shift(n){const d=addDays(cur,n);if(d>today())return;cur=d;render()}
function refreshCheck(){const h=$('hl');if(h)h.innerHTML=actHabits().map(x=>habHtml(x,cur)).join('');const p=$('prog');if(p)p.innerHTML=ring(dayRate(cur),'当日')}
function touchStart(d){if(d<S.start)S.start=d}
function toggle(id){const l=log(cur,true);touchStart(cur);const h=S.habits.find(x=>x.id===id);
  if(isDone(h,cur)&&!l.checks[id]){l.checks[id]=false;alert('这一项是根据数据自动判定为完成的。想取消,请修改上方对应的数据。');}
  else l.checks[id]=!l.checks[id];save();refreshCheck()}
function setNote(id,v){const l=log(cur,true);touchStart(cur);l.notes[id]=v;save()}
function setM(k,v){const l=log(cur,true);touchStart(cur);l.m[k]=v;save();refreshCheck()}
function setQ(i){const l=log(cur,true);touchStart(cur);l.m.sleepQ=(+l.m.sleepQ===i)?'':i;save();render()}
function setDiary(v){const l=log(cur,true);touchStart(cur);l.diary=v;save()}

function vGoals(){
  const t=today(),w0=addDays(t,-29);
  return `<div class="row" style="margin-top:8px"><button class="btn" onclick="editGoal()">＋ 新增目标</button><button class="btn ghost" onclick="editHabit()">＋ 新增打卡项</button></div>`+
  S.goals.map(g=>{
    const hs=actHabits().filter(h=>h.goal===g.id),r=goalRate(g.id,w0,t);let extra='';
    if(g.w0!=null){const c=latest('weight'),p=c?Math.max(0,Math.min(1,(g.w0-c.v)/(g.w0-g.w1))):0;extra=`<div class="muted" style="margin-top:8px">⚖️ ${g.w0} 斤 → ${g.w1} 斤,当前 ${c?c.v:'未记录'}</div><div class="bar"><i style="width:${p*100}%"></i></div>`}
    return `<div class="card"><div class="row"><h3 style="flex:1;margin:0">${esc(g.emoji)} ${esc(g.name)}</h3><button class="btn sm ghost fit" onclick="editGoal('${g.id}')">编辑</button></div>
    <div class="muted">${esc(g.desc||'')}</div><div class="muted" style="margin-top:8px">近30天完成率 ${pct(r)}</div><div class="bar"><i style="width:${(r||0)*100}%"></i></div>${extra}
    <div style="margin-top:10px">${hs.map(h=>`<div class="row" style="padding:4px 0"><span>• ${esc(h.name)}${h.weekly?`<span class="tag">每周${h.weekly}次</span>`:''}</span><span class="fit muted">${pct(hrate(h,w0,t))}</span><button class="btn sm ghost fit" onclick="editHabit('${h.id}')">✏️</button></div>`).join('')||'<div class="muted">还没有关联的打卡项</div>'}</div></div>`}).join('')+
  (actHabits().some(h=>!S.goals.find(g=>g.id===h.goal))?`<div class="card"><h3>未归属目标的打卡项</h3>${actHabits().filter(h=>!S.goals.find(g=>g.id===h.goal)).map(h=>`<div class="row"><span>• ${esc(h.name)}</span><button class="btn sm ghost fit" onclick="editHabit('${h.id}')">✏️</button></div>`).join('')}</div>`:'');
}
function openModal(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none'}
function editGoal(id){
  const g=S.goals.find(x=>x.id===id)||{emoji:'🎯',name:'',desc:''},hw=g.w0!=null;
  openModal(`<h3>${id?'编辑目标':'新增目标'}</h3>
  <div class="row"><div class="fit" style="width:70px"><label class="f">图标</label><input id="ge" type="text" value="${esc(g.emoji)}"></div><div><label class="f">目标名称</label><input id="gn" type="text" value="${esc(g.name)}"></div></div>
  <label class="f" style="margin-top:8px">说明</label><textarea id="gd" rows="2">${esc(g.desc)}</textarea>
  <label class="f" style="margin-top:8px"><input type="checkbox" id="gwc" ${hw?'checked':''} style="width:auto"> 这是体重目标(显示体重进度条)</label>
  <div class="grid2"><div><label class="f">起始体重(斤)</label><input id="gw0" type="number" step="any" value="${g.w0??''}"></div><div><label class="f">目标体重(斤)</label><input id="gw1" type="number" step="any" value="${g.w1??''}"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveGoal('${id||''}')">保存</button>${id?`<button class="btn danger" onclick="delGoal('${id}')">删除</button>`:''}<button class="btn ghost" onclick="closeModal()">取消</button></div>`)}
function saveGoal(id){
  const name=$('gn').value.trim();if(!name){alert('请填写目标名称');return}
  let g=S.goals.find(x=>x.id===id);if(!g){g={id:uid()};S.goals.push(g)}
  g.emoji=$('ge').value.trim()||'🎯';g.name=name;g.desc=$('gd').value.trim();
  if($('gwc').checked&&$('gw0').value&&$('gw1').value){g.w0=+$('gw0').value;g.w1=+$('gw1').value}else{delete g.w0;delete g.w1}
  save();closeModal();render()}
function delGoal(id){if(!confirm('删除这个目标?关联的打卡项会保留,但不再归属任何目标。'))return;
  S.goals=S.goals.filter(g=>g.id!==id);S.habits.forEach(h=>{if(h.goal===id)h.goal=''});save();closeModal();render()}
function editHabit(id){
  const h=S.habits.find(x=>x.id===id)||{name:'',goal:S.goals[0]?S.goals[0].id:'',kind:'manual',weekly:0,time:'23:00',steps:8000,min:30};
  openModal(`<h3>${id?'编辑打卡项':'新增打卡项'}</h3>
  <label class="f">名称</label><input id="hn" type="text" value="${esc(h.name)}">
  <label class="f" style="margin-top:8px">所属目标</label><select id="hg"><option value="">(无)</option>${S.goals.map(g=>`<option value="${g.id}" ${g.id===h.goal?'selected':''}>${esc(g.emoji)} ${esc(g.name)}</option>`).join('')}</select>
  <label class="f" style="margin-top:8px">完成判定方式</label><select id="hk"><option value="manual" ${h.kind==='manual'?'selected':''}>手动打勾</option><option value="bed" ${h.kind==='bed'?'selected':''}>按入睡时间自动判定</option><option value="ex" ${h.kind==='ex'?'selected':''}>按步数/运动时长自动判定</option></select>
  <div class="grid3" style="margin-top:8px"><div><label class="f">入睡不晚于</label><input id="ht" type="time" value="${h.time||'23:00'}"></div><div><label class="f">步数≥</label><input id="hs" type="number" value="${h.steps||8000}"></div><div><label class="f">运动分钟≥</label><input id="hm" type="number" value="${h.min||30}"></div></div>
  <label class="f" style="margin-top:8px">频率(0 = 每天;填数字 = 每周目标次数)</label><input id="hw" type="number" min="0" max="7" value="${h.weekly||0}">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveHabit('${id||''}')">保存</button>${id?`<button class="btn danger" onclick="delHabit('${id}')">删除</button>`:''}<button class="btn ghost" onclick="closeModal()">取消</button></div>
  ${id?'<p class="muted">删除 = 归档:历史记录保留,可在「设置」里恢复。</p>':''}`)}
function saveHabit(id){
  const name=$('hn').value.trim();if(!name){alert('请填写名称');return}
  let h=S.habits.find(x=>x.id===id);if(!h){h={id:uid()};S.habits.push(h)}
  Object.assign(h,{name,goal:$('hg').value,kind:$('hk').value,time:$('ht').value||'23:00',steps:+$('hs').value||8000,min:+$('hm').value||30,weekly:+$('hw').value||0});
  save();closeModal();render()}
function delHabit(id){if(!confirm('删除(归档)这个打卡项?'))return;S.habits.find(h=>h.id===id).archived=true;save();closeModal();render()}

/* ---------- charts ---------- */
function drawLine(id,dates,series,opt={}){
  const c=$(id);if(!c)return;const w=c.clientWidth,h=c.clientHeight,r=window.devicePixelRatio||1;
  c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);
  const cs=getComputedStyle(document.body),muted=cs.getPropertyValue('--muted').trim(),colors={main:cs.getPropertyValue('--main').trim(),accent:cs.getPropertyValue('--accent').trim()};
  const vals=series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!vals.length){g.fillStyle=muted;g.font='13px sans-serif';g.textAlign='center';g.fillText('还没有数据,先去打卡吧 🌱',w/2,h/2);return}
  let mn=opt.min!=null?opt.min:Math.min(...vals),mx=opt.max!=null?opt.max:Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1}const p=(mx-mn)*.12;if(opt.min==null)mn-=p;if(opt.max==null)mx+=p;
  const L=40,R=10,T=10,B=22,W=w-L-R,H=h-T-B,n=dates.length;
  const X=i=>L+(n<2?W/2:W*i/(n-1)),Y=v=>T+H*(1-(v-mn)/(mx-mn));
  g.font='11px sans-serif';g.fillStyle=muted;g.strokeStyle=muted;g.globalAlpha=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g.globalAlpha=.25;g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();g.globalAlpha=1;g.textAlign='right';g.fillText(opt.f?opt.f(v):fmt(v,(mx-mn)<10?1:0),L-5,y+4)}
  g.textAlign='center';[0,Math.floor((n-1)/2),n-1].forEach((i,k)=>{if(n>0)g.fillText(dates[i].slice(5),X(i),h-6)});
  series.forEach(s=>{
    g.strokeStyle=s.color?colors[s.color]||s.color:colors.main;g.fillStyle=g.strokeStyle;g.lineWidth=s.thin?1.5:2.5;g.globalAlpha=s.thin?.6:1;g.lineJoin='round';
    let started=false;g.beginPath();
    s.data.forEach((v,i)=>{if(v==null){started=false;return}if(!started){g.moveTo(X(i),Y(v));started=true}else g.lineTo(X(i),Y(v))});g.stroke();
    if(!s.thin)s.data.forEach((v,i)=>{if(v!=null&&n<=40){g.beginPath();g.arc(X(i),Y(v),3.2,0,7);g.fill()}});g.globalAlpha=1});
}
function drawBars(id,labels,data,opt={}){
  const c=$(id);if(!c)return;const w=c.clientWidth,h=c.clientHeight,r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;
  const g=c.getContext('2d');g.scale(r,r);const cs=getComputedStyle(document.body);
  const muted=cs.getPropertyValue('--muted').trim(),main=cs.getPropertyValue('--main').trim();
  const mx=opt.max||Math.max(1,...data.filter(v=>v!=null)),L=8,B=20,T=14,n=data.length,bw=(w-L*2)/n;
  g.font='11px sans-serif';g.textAlign='center';
  data.forEach((v,i)=>{const x=L+i*bw+bw*.15,ww=bw*.7;g.fillStyle=main;g.globalAlpha=.25;g.fillRect(x,T,ww,h-T-B);g.globalAlpha=1;
    if(v!=null){const bh=(h-T-B)*v/mx;g.fillRect(x,h-B-bh,ww,bh);g.fillStyle=muted;g.fillText(opt.f?opt.f(v):fmt(v),x+ww/2,h-B-bh-3)}
    g.fillStyle=muted;g.fillText(labels[i],x+ww/2,h-6)});
}
function rangeDates(n){const t=today(),a=[];for(let i=n-1;i>=0;i--)a.push(addDays(t,-i));return a}
function vTrend(){
  return `<div class="card">${[7,30,90,365].map(n=>`<span class="chip ${rangeDays===n?'on':''}" onclick="rangeDays=${n};render()">${n===365?'1年':n+'天'}</span>`).join('')}</div>`+
   Object.keys(METRICS).map(k=>`<div class="card"><h3>${METRICS[k].icon} ${METRICS[k].label}${k==='weight'?' <span class="muted">(虚线为7日均线)</span>':''}</h3><canvas id="c_${k}"></canvas></div>`).join('');
}
function drawTrend(){
  const ds=rangeDates(rangeDays);
  Object.keys(METRICS).forEach(k=>{
    const data=ds.map(d=>metricVal(d,k)),series=[{data}];
    if(k==='weight'){series.push({thin:true,color:'accent',data:ds.map((d,i)=>{const a=data.slice(Math.max(0,i-6),i+1).filter(v=>v!=null);return a.length?avg(a):null})})}
    drawLine('c_'+k,ds,series,k==='sleepQ'?{min:0,max:5}:k==='bed'?{f:fmtBed}:{});
  });
}

/* ---------- summary ---------- */
function monthRange(ym){const [y,m]=ym.split('-').map(Number);return [ym+'-01',ym+'-'+pad(new Date(y,m,0).getDate())]}
function stats(from,to){
  const ds=[];for(let d=from;d<=to&&d<=today();d=addDays(d,1))ds.push(d);
  const ws=ds.map(d=>metricVal(d,'weight')).filter(v=>v!=null);
  return {days:ds.length,done:ds.filter(anyDone).length,rate:allRate(from,to),steps:avg(ds.map(d=>metricVal(d,'steps'))),ex:avg(ds.map(d=>metricVal(d,'exMin'))),kcal:avg(ds.map(d=>metricVal(d,'kcal'))),q:avg(ds.map(d=>metricVal(d,'sleepQ'))),bed:avg(ds.map(d=>metricVal(d,'bed'))),wFirst:ws[0],wLast:ws[ws.length-1]};
}
function vSum(){
  const head=`<div class="card"><span class="chip ${sumMode==='m'?'on':''}" onclick="sumMode='m';render()">月度总结</span><span class="chip ${sumMode==='y'?'on':''}" onclick="sumMode='y';render()">年度总结</span></div>`;
  if(sumMode==='m'){
    const [f,t]=monthRange(sumMonth),s=stats(f,t),first=parse(f).getDay();
    let cells=['日','一','二','三','四','五','六'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
    const nd=+t.slice(8);for(let i=1;i<=nd;i++){const d=sumMonth+'-'+pad(i),r=d>today()?null:dayRate(d);
      cells+=`<div style="background:${r==null?'transparent':`color-mix(in srgb,var(--main) ${Math.round(15+r*85)}%,transparent)`};${r>.6?'color:#fff':''}">${i}</div>`}
    const dw=s.wFirst!=null?(s.wLast-s.wFirst):null;
    return head+`<div class="card"><input type="month" value="${sumMonth}" onchange="sumMonth=this.value||sumMonth;render()"></div>
    <div class="grid3"><div class="stat"><b>${pct(s.rate)}</b><small>整体完成率</small></div><div class="stat"><b>${s.done}/${s.days}</b><small>打卡天数</small></div><div class="stat"><b>${dw==null?'–':(dw>0?'+':'')+fmt(dw,1)}</b><small>体重变化(斤)</small></div>
    <div class="stat"><b>${fmt(s.steps)}</b><small>平均步数</small></div><div class="stat"><b>${fmt(s.ex)}</b><small>平均运动(分钟)</small></div><div class="stat"><b>${fmt(s.kcal)}</b><small>平均消耗kcal</small></div>
    <div class="stat"><b>${fmtBed(s.bed)}</b><small>平均入睡</small></div><div class="stat"><b>${fmt(s.q,1)}</b><small>平均睡眠质量</small></div><div class="stat"><b>${s.wLast??'–'}</b><small>月末体重</small></div></div>
    <div class="card"><h3>🗓️ 每日完成热力图</h3><div class="cal">${cells}</div></div>
    <div class="card"><h3>各打卡项完成率</h3>${actHabits().map(h=>`<div style="margin:8px 0"><div class="row"><span>${esc(h.name)}</span><span class="fit muted">${pct(hrate(h,f,t))}</span></div><div class="bar"><i style="width:${(hrate(h,f,t)||0)*100}%"></i></div></div>`).join('')}</div>
    <div class="card"><h3>本月小记</h3>${Object.keys(S.logs).filter(d=>d>=f&&d<=t&&S.logs[d].diary).sort().map(d=>`<div style="margin:6px 0"><span class="muted">${d.slice(5)}</span> ${esc(S.logs[d].diary)}</div>`).join('')||'<p class="muted">本月还没有小记</p>'}</div>`;
  }
  const rows=[];for(let m=1;m<=12;m++){const ym=sumYear+'-'+pad(m),[f,t]=monthRange(ym);rows.push({m,s:f>today()?null:stats(f,t)})}
  const ys=stats(sumYear+'-01-01',sumYear+'-12-31');
  return head+`<div class="card"><div class="row"><button class="btn ghost fit" onclick="sumYear=String(+sumYear-1);render()">◀</button><b style="text-align:center">${sumYear} 年</b><button class="btn ghost fit" onclick="sumYear=String(+sumYear+1);render()">▶</button></div></div>
  <div class="grid3"><div class="stat"><b>${pct(ys.rate)}</b><small>全年完成率</small></div><div class="stat"><b>${ys.done}</b><small>打卡天数</small></div><div class="stat"><b>${ys.wFirst!=null?(ys.wLast-ys.wFirst>0?'+':'')+fmt(ys.wLast-ys.wFirst,1):'–'}</b><small>体重变化(斤)</small></div></div>
  <div class="card"><h3>各月完成率</h3><canvas id="y_rate"></canvas></div>
  <div class="card"><h3>各月平均步数</h3><canvas id="y_steps"></canvas></div>
  <div class="card"><h3>各月月末体重(斤)</h3><canvas id="y_w"></canvas></div>
  <div class="card"><table><tr><th>月</th><th>完成率</th><th>步数</th><th>运动</th><th>睡眠分</th><th>体重</th></tr>${rows.map(r=>`<tr><td>${r.m}</td><td>${r.s?pct(r.s.rate):'–'}</td><td>${r.s?fmt(r.s.steps):'–'}</td><td>${r.s?fmt(r.s.ex):'–'}</td><td>${r.s?fmt(r.s.q,1):'–'}</td><td>${r.s?r.s.wLast??'–':'–'}</td></tr>`).join('')}</table></div>`;
}
function drawSum(){
  if(sumMode!=='y')return;const L=[],R=[],ST=[],W=[];
  for(let m=1;m<=12;m++){const [f,t]=monthRange(sumYear+'-'+pad(m));L.push(m+'月');const s=f>today()?null:stats(f,t);R.push(s&&s.rate!=null?s.rate:null);ST.push(s&&s.steps!=null?s.steps:null);W.push(s&&s.wLast!=null?s.wLast:null)}
  drawBars('y_rate',L,R,{max:1,f:v=>Math.round(v*100)+'%'});drawBars('y_steps',L,ST);
  drawLine('y_w',L,[{data:W}],{f:v=>fmt(v,1)});
}

/* ---------- settings ---------- */
function vSet(){
  const arch=S.habits.filter(h=>h.archived);
  return `<div class="card"><h3>🏷️ 计划名称</h3><input type="text" value="${esc(S.settings.name)}" onchange="S.settings.name=this.value||'豆子发芽';save();render()"></div>
  <div class="card"><h3>🎨 主题颜色</h3>${Object.entries(THEMES).map(([k,n])=>`<span class="chip ${S.settings.theme===k?'on':''}" onclick="S.settings.theme='${k}';save();render()">${n}</span>`).join('')}</div>
  <div class="card"><h3>🖼️ 背景图片</h3><input type="file" accept="image/*" id="bgf" onchange="setBg(this.files[0])">
   <label class="f" style="margin-top:10px">蒙层浓度(越高越柔和、文字越清晰)</label><input type="range" min="0" max="95" value="${S.settings.bgOpacity}" oninput="S.settings.bgOpacity=+this.value;$('bgov').style.opacity=this.value/100" onchange="save()" style="width:100%">
   ${S.settings.bg?'<button class="btn sm danger" style="margin-top:8px" onclick="S.settings.bg=\'\';save();render()">移除背景</button>':''}</div>
  <div class="card"><h3>💾 数据备份</h3><p class="muted">数据保存在本浏览器里。换设备或清理缓存前,请先导出备份。</p>
   <div class="row"><button class="btn" onclick="exportData()">导出 JSON</button><button class="btn ghost" onclick="$('imp').click()">导入 JSON</button></div>
   <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></div>
  <div class="card"><h3>🗄️ 已归档的打卡项</h3>${arch.map(h=>`<div class="row"><span>${esc(h.name)}</span><button class="btn sm ghost fit" onclick="S.habits.find(x=>x.id==='${h.id}').archived=false;save();render()">恢复</button></div>`).join('')||'<p class="muted">暂无</p>'}</div>
  <div class="card"><h3>⚠️ 危险操作</h3><button class="btn danger" onclick="if(confirm('确定清空所有数据?此操作不可恢复,建议先导出备份。')){localStorage.removeItem(KEY);load();render()}">清空所有数据</button></div>`;
}
function setBg(f){if(!f)return;const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.settings.bg=c.toDataURL('image/jpeg',.75);save();render()};im.src=e.target.result};rd.readAsDataURL(f)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='douzi_fayea_'+today()+'.json';a.click()}
function importData(f){if(!f)return;const rd=new FileReader();rd.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.habits||!d.logs)throw 0;if(!confirm('导入会覆盖当前数据,继续吗?'))return;S=d;migrate();save();render();alert('导入成功 🌱')}catch(x){alert('文件格式不正确')}};rd.readAsText(f)}
window.addEventListener('resize',()=>{if(tab==='trend')drawTrend();if(tab==='sum')drawSum()});
load();render();
</script></body></html>
